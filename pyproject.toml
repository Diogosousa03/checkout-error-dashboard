[project]
name = "error-dashboard"
version = "0.1.0"
description = "Internal Streamlit dashboard for checkout error monitoring, fed by the error catalogue."
requires-python = ">=3.11"
dependencies = [
    "streamlit",
    "pandas",
    "httpx",
    "pydantic>=2",
    "pydantic-settings",
    "structlog",
    "pyyaml",
]

# Managed with uv:  uv sync   /   uv run streamlit run src/error_dashboard/app.py

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/error_dashboard"]
